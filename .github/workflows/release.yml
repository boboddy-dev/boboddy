name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Is this a prerelease?"
        required: true
        type: boolean
        default: false
      release_docs:
        description: "Force a GitHub Pages docs deploy?"
        required: true
        type: boolean
        default: false
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ai-worker

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - name: Resolve version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            PRERELEASE="${{ inputs.prerelease }}"
          else
            RAW_TAG="${{ github.ref_name }}"
            VERSION="${RAW_TAG#v}"
            if echo "$VERSION" | grep -qE '-(alpha|beta|rc|next)'; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi
          fi
          if [ -z "$VERSION" ]; then
            echo "Version is empty." >&2
            exit 1
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v$VERSION"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

  build-push-docker:
    runs-on: ubuntu-latest
    needs: resolve-version
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build opencode plugin
        run: |
          bun run --filter @boboddy/opencode-plugin declarations
          bun run --filter @boboddy/opencode-plugin build

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push versioned tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/containers/ai-worker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve-version.outputs.tag }}

  build-cli-linux:
    runs-on: ubuntu-latest
    needs: resolve-version
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check generated client is in sync
        run: |
          bun run clientGen:ts
          if [ -n "$(git status --porcelain packages/sdks/js/src/generated/)" ]; then
            echo "Generated API client is out of sync with the OpenAPI spec."
            echo "Run 'bun run clientGen:ts' locally and commit the changes."
            git diff packages/sdks/js/src/generated/
            exit 1
          fi

      - name: Build opencode plugin
        run: |
          bun run --filter @boboddy/opencode-plugin declarations
          bun run --filter @boboddy/opencode-plugin build

      - name: Stamp CLI version
        working-directory: apps/cli
        run: npm pkg set version="${{ needs.resolve-version.outputs.version }}"

      - name: Build CLI binaries
        env:
          CLI_BUILD_VERSION: ${{ needs.resolve-version.outputs.version }}
          AI_IMAGE_REGISTRY: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: bun run --filter @boboddy/cli build

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: cli-dist
          path: apps/cli/dist/

  sign-cli-macos:
    runs-on: macos-latest
    needs: build-cli-linux
    permissions:
      contents: read
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: cli-dist
          path: dist/

      - name: Sign macOS binaries
        run: |
          chmod +x dist/boboddy-darwin-*
          for bin in dist/boboddy-darwin-*; do
            codesign --remove-signature "$bin" || true
            codesign --sign - --force "$bin"
          done

      - name: Upload signed binaries
        uses: actions/upload-artifact@v4
        with:
          name: cli-dist-signed
          path: dist/

  publish:
    runs-on: ubuntu-latest
    needs: [resolve-version, sign-cli-macos]
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK
        run: bun run --filter @boboddy/sdk build

      - name: Build opencode plugin
        run: |
          bun run --filter @boboddy/opencode-plugin declarations
          bun run --filter @boboddy/opencode-plugin build

      - name: Download signed CLI binaries
        uses: actions/download-artifact@v4
        with:
          name: cli-dist-signed
          path: apps/cli/dist/

      - name: Restore binary permissions
        run: chmod +x apps/cli/dist/boboddy-darwin-* apps/cli/dist/boboddy-linux-*

      - name: Stamp package versions
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          npm pkg set version="$VERSION" --prefix packages/sdks/js

          npm pkg set version="$VERSION" --prefix packages/opencode-plugin
          npm pkg set dependencies."@boboddy/sdk"="^$VERSION" --prefix packages/opencode-plugin
          npm pkg delete dependencies."@opencode-ai/sdk" --prefix packages/opencode-plugin
          npm pkg delete dependencies."ajv" --prefix packages/opencode-plugin

          npm pkg set version="$VERSION" --prefix apps/cli
          npm pkg delete private --prefix apps/cli
          npm pkg delete dependencies."@boboddy/opencode-plugin" --prefix apps/cli
          npm pkg delete dependencies."@boboddy/runtime-proxy" --prefix apps/cli
          npm pkg delete dependencies."@boboddy/sdk" --prefix apps/cli
          npm pkg delete dependencies."@boboddy/worker" --prefix apps/cli

      - name: Check npm version
        run: npm --version

      - name: Publish SDK
        working-directory: packages/sdks/js
        run: |
          if [ "${{ needs.resolve-version.outputs.prerelease }}" = "true" ]; then
            bun run script/publish.ts next
          else
            bun run script/publish.ts latest
          fi

      # - name: Publish opencode plugin
      #   working-directory: packages/opencode-plugin
      #   run: |
      #     if [ "${{ needs.resolve-version.outputs.prerelease }}" = "true" ]; then
      #       npm publish --access public --tag next
      #     else
      #       npm publish --access public --tag latest
      #     fi

      - name: Publish CLI
        working-directory: apps/cli
        run: |
          if [ "${{ needs.resolve-version.outputs.prerelease }}" = "true" ]; then
            npm publish --access public --tag next
          else
            npm publish --access public --tag latest
          fi

      - name: Create git tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.resolve-version.outputs.version }}"
          git push origin "v${{ needs.resolve-version.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.resolve-version.outputs.version }}"
          generate_release_notes: true
          prerelease: ${{ needs.resolve-version.outputs.prerelease == 'true' }}
          files: apps/cli/dist/boboddy-*

  resolve-docs-deploy:
    runs-on: ubuntu-latest
    needs: publish
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      reason: ${{ steps.check.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether docs should deploy
        id: check
        run: |
          FORCE_DEPLOY="${{ github.event_name == 'workflow_dispatch' && inputs.release_docs || 'false' }}"

          if [ "$FORCE_DEPLOY" = "true" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow input requested docs deploy" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags origin main

          CURRENT_COMMIT="$(git rev-parse HEAD)"
          BASE_COMMIT=""

          while IFS= read -r commit; do
            if [ "$commit" = "$CURRENT_COMMIT" ]; then
              continue
            fi

            if git tag --points-at "$commit" | grep -qE '^v'; then
              BASE_COMMIT="$commit"
              break
            fi
          done <<EOF
          $(git rev-list --first-parent origin/main)
          EOF

          if [ -z "$BASE_COMMIT" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=no previous release tag found on main" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --quiet "$BASE_COMMIT" HEAD -- docs; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "reason=docs unchanged since previous release tag on main" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "reason=docs changed since previous release tag on main" >> "$GITHUB_OUTPUT"
          fi

  deploy-docs:
    runs-on: ubuntu-latest
    needs: [publish, resolve-docs-deploy]
    if: needs.resolve-docs-deploy.outputs.should_deploy == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install docs dependencies
        working-directory: docs
        run: npm install

      - name: Build docs
        working-directory: docs
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Re-tag the already-pushed versioned image as `latest` — no rebuild needed.
  # Gates on both the image being built AND the publish succeeding.
  tag-docker-latest:
    runs-on: ubuntu-latest
    needs: [resolve-version, build-push-docker, publish]
    if: needs.resolve-version.outputs.prerelease == 'false'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote versioned image to latest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.resolve-version.outputs.tag }}
