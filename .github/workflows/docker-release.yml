name: Docker Release (AI Worker)

# Manual-only. Run this when the AI container image needs to change.
# After a successful push, update apps/cli/ai-image.txt to the new tag
# so future CLI/canary builds pick it up.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag to publish (e.g. v0.3.2). Must be unique — GHCR does not prevent overwriting tags."
        required: true
        type: string
      promote_latest:
        description: "Also retag this image as 'latest'?"
        required: true
        type: boolean
        default: false

concurrency:
  group: docker-release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ai-worker

jobs:
  build-push-docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build opencode plugin
        run: |
          bun run --filter @boboddy/opencode-plugin declarations
          bun run --filter @boboddy/opencode-plugin build

      - name: Resolve image metadata
        id: meta
        run: |
          TAG="${{ inputs.image_tag }}"
          REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push versioned tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/containers/ai-worker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.image_ref }}

  promote-latest:
    runs-on: ubuntu-latest
    needs: build-push-docker
    if: inputs.promote_latest == true
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote versioned image to latest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            ${{ needs.build-push-docker.outputs.image_ref }}

  summary:
    runs-on: ubuntu-latest
    needs: [build-push-docker, promote-latest]
    if: always() && needs.build-push-docker.result == 'success'
    steps:
      - name: Print next steps
        run: |
          echo "## AI Worker image published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image ref:** \`${{ needs.build-push-docker.outputs.image_ref }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "To pin the CLI and canary builds to this image, update \`apps/cli/ai-image.txt\`:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ needs.build-push-docker.outputs.image_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
