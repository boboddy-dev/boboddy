name: Deploy docs

# Builds the Astro docs site (apps/docs) and deploys it to GitHub Pages for this
# public repo. Hosted at https://boboddy-dev.github.io/boboddy/.
#
# It can be run manually from the Actions tab to redeploy docs.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent docs deployment; don't cancel an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy-docs:
    name: Deploy docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build docs
        run: bun run --filter boboddy-docs build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist/

      - id: deployment
        uses: actions/deploy-pages@v4
