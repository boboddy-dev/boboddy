name: CI

on:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - name: Check generated client is in sync
        run: |
          bun run clientGen:ts
          if [ -n "$(git status --porcelain packages/sdks/js/src/generated/)" ]; then
            echo "Generated API client is out of sync with the OpenAPI spec."
            echo "Run 'bun run clientGen:ts' locally and commit the changes."
            git diff packages/sdks/js/src/generated/
            exit 1
          fi
      - run: bun run --filter '@boboddy/containers' --filter '@boboddy/opencode-plugin' declarations

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@boboddy/containers' --filter '@boboddy/opencode-plugin' declarations
      - run: bun run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@boboddy/containers' --filter '@boboddy/opencode-plugin' declarations
      - name: Build CLI binary
        run: bun run --filter @boboddy/cli build
      - name: Pull AI worker image
        run: bun run apps/cli/src/index.ts images pull
      - run: bun run test

  integration-test:
    runs-on: ubuntu-latest
    # Exercises the real `work` command pipeline (claim -> clone -> devcontainer
    # + AI container -> agent -> findings -> complete) with only the AI provider,
    # server API, and git clone faked. Containers are launched via testcontainers.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12
      - run: bun install --frozen-lockfile
      - run: bun run --filter '@boboddy/containers' --filter '@boboddy/opencode-plugin' declarations
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          if [ -n "$GHCR_TOKEN" ]; then
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          else
            echo "GHCR_TOKEN not set; relying on the AI image being pullable without auth."
          fi
      - name: Pull AI worker image
        run: bun run apps/cli/src/index.ts images pull
      - name: Pull devcontainer base image
        run: docker pull mcr.microsoft.com/devcontainers/base:debian
      - name: Run work command integration tests
        working-directory: packages/worker
        env:
          BOBODDY_INTEGRATION: "true"
          # On Linux runners host.docker.internal is not auto-resolvable; the AI
          # launcher adds --add-host host.docker.internal:host-gateway, so the
          # fake AI server (bound on 0.0.0.0) is reachable from the container.
          BOBODDY_FAKE_AI_HOST: host.docker.internal
        run: bun test tests/work/step-execution/integration
