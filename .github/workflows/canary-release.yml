name: Canary Release

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: canary-release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  publish-canary:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve canary version
        id: version
        run: |
          git fetch --tags origin
          # BASE_TAG="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          # BASE_VERSION="${BASE_TAG#v}"
          #
          # if [ -z "$BASE_VERSION" ] || [ "$BASE_VERSION" = "$BASE_TAG" ]; then
            BASE_VERSION="0.0.0"
          # fi

          # SHORT_SHA="$(git rev-parse --short HEAD)"
          SHA="$(git rev-parse HEAD)"
          # VERSION="${BASE_VERSION}-canary.pr.${{ github.event.pull_request.number }}.${{ github.run_number }}.${{ github.run_attempt }}.${SHORT_SHA}"
          VERSION="${BASE_VERSION}-canary.${SHA}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check generated client is in sync
        run: |
          bun run clientGen:ts
          if [ -n "$(git status --porcelain packages/sdks/js/src/generated/)" ]; then
            echo "Generated API client is out of sync with the OpenAPI spec."
            echo "Run 'bun run clientGen:ts' locally and commit the changes."
            git diff packages/sdks/js/src/generated/
            exit 1
          fi

      - name: Build opencode plugin
        run: |
          bun run --filter @boboddy/opencode-plugin declarations
          bun run --filter @boboddy/opencode-plugin build

      - name: Stamp package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pkg set version="$VERSION" --prefix packages/sdks/js

          npm pkg set version="$VERSION" --prefix packages/opencode-plugin
          npm pkg set dependencies."@boboddy/sdk"="^$VERSION" --prefix packages/opencode-plugin
          npm pkg delete dependencies."@opencode-ai/sdk" --prefix packages/opencode-plugin
          npm pkg delete dependencies."ajv" --prefix packages/opencode-plugin

          npm pkg set version="$VERSION" --prefix apps/cli
          npm pkg delete private --prefix apps/cli
          npm pkg delete dependencies."@boboddy/opencode-plugin" --prefix apps/cli
          npm pkg delete dependencies."@boboddy/runtime-proxy" --prefix apps/cli
          npm pkg delete dependencies."@boboddy/sdk" --prefix apps/cli
          npm pkg delete dependencies."@boboddy/worker" --prefix apps/cli

      - name: Build SDK
        run: bun run --filter @boboddy/sdk build

      - name: Build CLI binaries
        env:
          CLI_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: bun run --filter @boboddy/cli build

      - name: Publish SDK canary
        working-directory: packages/sdks/js
        run: bun run script/publish.ts canary

      - name: Publish CLI canary
        working-directory: apps/cli
        run: npm publish --access public --tag canary
