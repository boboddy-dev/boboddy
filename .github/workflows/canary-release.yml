name: Canary Release

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, closed]

concurrency:
  group: canary-release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup-canary:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Delete previous canary versions
        shell: bash
        run: |
          # On synchronize: delete the version built from the previous HEAD SHA
          # On closed: delete the version built from the current HEAD SHA
          if [ "${{ github.event.action }}" = "synchronize" ]; then
            SHA="${{ github.event.before }}"
          else
            SHA="${{ github.event.pull_request.head.sha }}"
          fi
          VERSION="0.0.0-canary.${SHA}"
          echo "Attempting to delete canary versions: ${VERSION}"
          if npm unpublish "@boboddy/sdk@${VERSION}" --registry https://registry.npmjs.org 2>/dev/null; then
            echo "Successfully unpublished @boboddy/sdk@${VERSION}"
          else
            echo "@boboddy/sdk@${VERSION} was not unpublished (may not have existed)"
          fi
          if npm unpublish "@boboddy/cli@${VERSION}" --registry https://registry.npmjs.org 2>/dev/null; then
            echo "Successfully unpublished @boboddy/cli@${VERSION}"
          else
            echo "@boboddy/cli@${VERSION} was not unpublished (may not have existed)"
          fi

  build-canary:
    if: >
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.action != 'closed'
    needs: cleanup-canary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      canary_version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve canary version
        id: version
        run: |
          SHA="$(git rev-parse HEAD)"
          VERSION="0.0.0-canary.${SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check generated client is in sync
        run: |
          bun run clientGen:ts
          if [ -n "$(git status --porcelain packages/sdks/js/src/generated/)" ]; then
            echo "Generated API client is out of sync with the OpenAPI spec."
            echo "Run 'bun run clientGen:ts' locally and commit the changes."
            git diff packages/sdks/js/src/generated/
            exit 1
          fi

      - name: Build opencode plugin
        run: |
          bun run --filter @boboddy/opencode-plugin declarations
          bun run --filter @boboddy/opencode-plugin build

      - name: Stamp package versions
        run: bun run scripts/stamp-versions.ts ${{ steps.version.outputs.version }}

      - name: Build SDK
        run: bun run --filter @boboddy/sdk build

      - name: Build CLI binaries
        env:
          CLI_BUILD_VERSION: ${{ steps.version.outputs.version }}
        # AI image tag is read from apps/cli/ai-image.txt — canary reuses the
        # currently pinned stable image. Update ai-image.txt and cut a new
        # manual Docker release if a canary needs a different image.
        run: bun run --filter @boboddy/cli build

      - name: Upload CLI dist
        uses: actions/upload-artifact@v4
        with:
          name: canary-cli-dist
          path: apps/cli/dist/
          include-hidden-files: true
          retention-days: 1

      - name: Upload SDK dist
        uses: actions/upload-artifact@v4
        with:
          name: canary-sdk-dist
          path: packages/sdks/js/dist/
          retention-days: 1

  sign-canary-macos:
    needs: build-canary
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Download CLI dist
        uses: actions/download-artifact@v4
        with:
          name: canary-cli-dist
          path: dist/

      - name: Sign macOS binaries
        run: |
          chmod +x dist/boboddy-darwin-*
          for bin in dist/boboddy-darwin-*; do
            codesign --remove-signature "$bin" || true
            codesign --sign - --force "$bin"
          done

      - name: Upload signed CLI dist
        uses: actions/upload-artifact@v4
        with:
          name: canary-cli-dist-signed
          path: dist/
          include-hidden-files: true
          retention-days: 1

  publish-canary:
    needs: [build-canary, sign-canary-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    outputs:
      canary_version: ${{ needs.build-canary.outputs.canary_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stamp package versions
        run: bun run scripts/stamp-versions.ts ${{ needs.build-canary.outputs.canary_version }}

      - name: Download SDK dist
        uses: actions/download-artifact@v4
        with:
          name: canary-sdk-dist
          path: packages/sdks/js/dist/

      - name: Download signed CLI dist
        uses: actions/download-artifact@v4
        with:
          name: canary-cli-dist-signed
          path: apps/cli/dist/

      - name: Restore binary permissions
        run: chmod +x apps/cli/dist/boboddy-darwin-* apps/cli/dist/boboddy-linux-*

      - name: Publish SDK canary
        working-directory: packages/sdks/js
        run: bun run script/publish.ts canary

      - name: Publish CLI canary
        working-directory: apps/cli
        run: bun run script/publish.ts canary

      - name: Post canary metadata comment
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CANARY_VERSION: ${{ needs.build-canary.outputs.canary_version }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          MARKER="<!-- boboddy-canary-version -->"
          BODY="${MARKER}
          **Canary published** \`${CANARY_VERSION}\`

          | Field | Value |
          |---|---|
          | cli_version | \`${CANARY_VERSION}\` |
          | branch | \`${HEAD_BRANCH}\` |
          | sha | \`${HEAD_SHA}\` |

          _Updated by the Canary Release workflow._"

          # Find and update an existing marker comment, or create a new one.
          COMMENT_ID="$(gh api \
            "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
            | head -n 1 || echo "")"

          if [ -n "$COMMENT_ID" ]; then
            gh api \
              --method PATCH \
              "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -f body="$BODY"
          else
            gh api \
              --method POST \
              "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              -f body="$BODY"
          fi
