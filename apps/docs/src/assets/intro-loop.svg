<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" fill="none" role="img" aria-labelledby="intro-loop-title intro-loop-desc">
  <title id="intro-loop-title">The Boboddy loop</title>
  <desc id="intro-loop-desc">A work item arrives, a pipeline is picked for it, a worker runs the pipeline's current step, and the step's signals decide whether to advance to the next step, block for a human, or finish.</desc>
  <defs>
    <marker id="intro-loop-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6e7681"/>
    </marker>
  </defs>
  <style>
    .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; }
    .box-accent { fill: #161b22; stroke: #38bdf8; stroke-width: 1.5; }
    .title { fill: #e6edf3; font: 600 18px Inter, ui-sans-serif, system-ui, sans-serif; }
    .sub { fill: #9198a1; font: 400 14px Inter, ui-sans-serif, system-ui, sans-serif; }
    .edge { stroke: #6e7681; stroke-width: 1.5; }
    .edge-label { fill: #9198a1; font: 400 13px "JetBrains Mono", ui-monospace, monospace; }
  </style>

  <rect class="box" x="20" y="30" width="200" height="96" rx="10"/>
  <text class="title" x="120" y="72" text-anchor="middle">Work item</text>
  <text class="sub" x="120" y="98" text-anchor="middle">an issue or a ticket</text>

  <rect class="box" x="260" y="30" width="200" height="96" rx="10"/>
  <text class="title" x="360" y="72" text-anchor="middle">Pipeline</text>
  <text class="sub" x="360" y="98" text-anchor="middle">a few named steps</text>

  <rect class="box" x="500" y="30" width="200" height="96" rx="10"/>
  <text class="title" x="600" y="72" text-anchor="middle">Worker runs a step</text>
  <text class="sub" x="600" y="98" text-anchor="middle">on your machine</text>

  <rect class="box-accent" x="740" y="30" width="200" height="96" rx="10"/>
  <text class="title" x="840" y="72" text-anchor="middle">Signals decide</text>
  <text class="sub" x="840" y="98" text-anchor="middle">advance · block · done</text>

  <line class="edge" x1="220" y1="78" x2="258" y2="78" marker-end="url(#intro-loop-arrow)"/>
  <line class="edge" x1="460" y1="78" x2="498" y2="78" marker-end="url(#intro-loop-arrow)"/>
  <line class="edge" x1="700" y1="78" x2="738" y2="78" marker-end="url(#intro-loop-arrow)"/>

  <path class="edge" d="M840 126 V176 H600 V128" marker-end="url(#intro-loop-arrow)"/>
  <text class="edge-label" x="720" y="200" text-anchor="middle">advance: run the next step</text>
</svg>
