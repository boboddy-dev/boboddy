    <path d="M144.9 385C144.9 414.7 175.93 438.6 214.2 438.6H297.8C336.07 438.6 367.1 414.7 367.1 385L403.4 166.6C404.58 159.5 397.39 153.187 388.09 153.187H123.91C114.61 153.187 107.42 159.5 108.6 166.6L144.9 385Z" fill="white"/>

